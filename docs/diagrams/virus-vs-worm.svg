<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" role="img" aria-labelledby="t d"><title id="t">Virus vs worm</title><desc id="d">Left: a virus spreads by infecting files, passing from one file to the next, and needs someone to open or run an infected file. Right: a worm spreads by itself, copying itself from computer to computer across a network through the LAN, email or links, with no one needing to open anything.</desc><style>
.bg{fill:#ffffff}
.t{font:600 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.tb{font:700 17px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.s{font:500 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#5b6a78}
.m{font:600 13px ui-monospace,Menlo,Consolas,monospace;fill:#12202b}
.h{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#0a6b84;letter-spacing:.08em}
.w{fill:#ffffff}
.box{fill:#f3f8fa;stroke:#a9bfca;stroke-width:1.5}
.acc{fill:#e3f1f5;stroke:#0a6b84;stroke-width:1.5}
.bad{fill:#fbe5e3;stroke:#b3302b;stroke-width:1.5}
.good{fill:#e1f3e8;stroke:#1d7a45;stroke-width:1.5}
.amb{fill:#fbf0dc;stroke:#a8650a;stroke-width:1.5}
.dim{fill:#eef2f4;stroke:#c9d3da;stroke-width:1.5}
.solid-acc{fill:#0a6b84}.solid-bad{fill:#b3302b}.solid-good{fill:#1d7a45}.solid-amb{fill:#a8650a}.solid-ink{fill:#12202b}
.ln{stroke:#5b6a78;stroke-width:2;fill:none}
.ln-acc{stroke:#0a6b84;stroke-width:2.2;fill:none}
.ln-bad{stroke:#b3302b;stroke-width:2.2;fill:none}
.ln-good{stroke:#1d7a45;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5}
.tx-acc{fill:#0a6b84}.tx-bad{fill:#b3302b}.tx-good{fill:#1d7a45}.tx-amb{fill:#a8650a}
.ic{fill:none;stroke:#12202b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-bad{fill:none;stroke:#b3302b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-acc{fill:none;stroke:#0a6b84;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mk-ln{fill:#5b6a78}.mk-acc{fill:#0a6b84}.mk-bad{fill:#b3302b}.mk-good{fill:#1d7a45}
@media (prefers-color-scheme: dark){
.bg{fill:#15202a}
.t,.tb,.m{fill:#e6edf3}.s{fill:#98a8b6}.h{fill:#4fb6cf}
.box{fill:#192632;stroke:#3a4c5a}.acc{fill:#143440;stroke:#4fb6cf}.bad{fill:#3c1d1b;stroke:#ef7c76}
.good{fill:#15352a;stroke:#5cc98a}.amb{fill:#392b13;stroke:#e2a645}.dim{fill:#1b2833;stroke:#34444f}
.solid-acc{fill:#2f8fa8}.solid-bad{fill:#c9534d}.solid-good{fill:#2f9a5f}.solid-amb{fill:#b97c1e}.solid-ink{fill:#e6edf3}
.ln{stroke:#98a8b6}.ln-acc{stroke:#4fb6cf}.ln-bad{stroke:#ef7c76}.ln-good{stroke:#5cc98a}
.tx-acc{fill:#4fb6cf}.tx-bad{fill:#ef7c76}.tx-good{fill:#5cc98a}.tx-amb{fill:#e2a645}
.ic{stroke:#e6edf3}.ic-bad{stroke:#ef7c76}.ic-acc{stroke:#4fb6cf}
.mk-ln{fill:#98a8b6}.mk-acc{fill:#4fb6cf}.mk-bad{fill:#ef7c76}.mk-good{fill:#5cc98a}
}
</style><defs><marker id="a-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-ln"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-acc"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-bad"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-good"/></marker></defs><rect class="bg" width="760" height="244" rx="16"/><text x="24" y="32" class="h" text-anchor="start">VIRUS: SPREADS BY INFECTING FILES</text><rect x="50" y="60" width="70" height="86" rx="10" class="bad"/><path d="M100 60 v16 h20" class="ln"/><text x="85" y="112" class="s" text-anchor="middle">file</text><path d="M124 103 L166 103" class="ln-bad" marker-end="url(#a-bad)"/><rect x="170" y="60" width="70" height="86" rx="10" class="bad"/><path d="M220 60 v16 h20" class="ln"/><text x="205" y="112" class="s" text-anchor="middle">file</text><path d="M244 103 L286 103" class="ln-bad" marker-end="url(#a-bad)"/><rect x="290" y="60" width="70" height="86" rx="10" class="bad"/><path d="M340 60 v16 h20" class="ln"/><text x="325" y="112" class="s" text-anchor="middle">file</text><circle cx="110" cy="186" r="7" class="ic"/><path d="M98 210 q0 -14 12 -14 q12 0 12 14" class="ic"/><text x="160" y="196" class="s" text-anchor="start">needs someone to</text><text x="160" y="214" class="s" text-anchor="start">open or run a file</text><path d="M400 20 V240" class="ln dash"/><text x="424" y="32" class="h" text-anchor="start">WORM: SPREADS BY ITSELF</text><rect x="440" y="54" width="60" height="50" rx="10" class="bad"/><rect x="455" y="65" width="30" height="20" rx="3" class="ic-bad"/><path d="M463 91 h14 M470 85 v6" class="ic-bad"/><rect x="570" y="54" width="60" height="50" rx="10" class="bad"/><rect x="585" y="65" width="30" height="20" rx="3" class="ic-bad"/><path d="M593 91 h14 M600 85 v6" class="ic-bad"/><rect x="690" y="54" width="60" height="50" rx="10" class="bad"/><rect x="705" y="65" width="30" height="20" rx="3" class="ic-bad"/><path d="M713 91 h14 M720 85 v6" class="ic-bad"/><rect x="500" y="144" width="60" height="50" rx="10" class="bad"/><rect x="515" y="155" width="30" height="20" rx="3" class="ic-bad"/><path d="M523 181 h14 M530 175 v6" class="ic-bad"/><rect x="630" y="144" width="60" height="50" rx="10" class="bad"/><rect x="645" y="155" width="30" height="20" rx="3" class="ic-bad"/><path d="M653 181 h14 M660 175 v6" class="ic-bad"/><path d="M502 80 L568 80" class="ln-bad" marker-end="url(#a-bad)"/><path d="M632 80 L688 80" class="ln-bad" marker-end="url(#a-bad)"/><path d="M502 106 L498 144" class="ln-bad" marker-end="url(#a-bad)"/><path d="M562 170 L628 170" class="ln-bad" marker-end="url(#a-bad)"/><path d="M632 106 L628 144" class="ln-bad" marker-end="url(#a-bad)"/><text x="590" y="226" class="s" text-anchor="middle">Self-replicates across the network (LAN, email, links)</text></svg>
