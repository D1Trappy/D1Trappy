<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d"><title id="t">DoS vs DDoS</title><desc id="d">Top: a DoS attack, where one attacker uses one computer to flood a web server with requests. It is easy to block because there is one source. Bottom: a DDoS attack, where the attacker controls a command-and-control server that directs many infected zombie computers (a botnet) to flood the web server at once. It is hard to block because traffic comes from everywhere.</desc><style>
.bg{fill:#ffffff}
.t{font:600 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.tb{font:700 17px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.s{font:500 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#5b6a78}
.m{font:600 13px ui-monospace,Menlo,Consolas,monospace;fill:#12202b}
.h{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#0a6b84;letter-spacing:.08em}
.w{fill:#ffffff}
.box{fill:#f3f8fa;stroke:#a9bfca;stroke-width:1.5}
.acc{fill:#e3f1f5;stroke:#0a6b84;stroke-width:1.5}
.bad{fill:#fbe5e3;stroke:#b3302b;stroke-width:1.5}
.good{fill:#e1f3e8;stroke:#1d7a45;stroke-width:1.5}
.amb{fill:#fbf0dc;stroke:#a8650a;stroke-width:1.5}
.dim{fill:#eef2f4;stroke:#c9d3da;stroke-width:1.5}
.solid-acc{fill:#0a6b84}.solid-bad{fill:#b3302b}.solid-good{fill:#1d7a45}.solid-amb{fill:#a8650a}.solid-ink{fill:#12202b}
.ln{stroke:#5b6a78;stroke-width:2;fill:none}
.ln-acc{stroke:#0a6b84;stroke-width:2.2;fill:none}
.ln-bad{stroke:#b3302b;stroke-width:2.2;fill:none}
.ln-good{stroke:#1d7a45;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5}
.tx-acc{fill:#0a6b84}.tx-bad{fill:#b3302b}.tx-good{fill:#1d7a45}.tx-amb{fill:#a8650a}
.ic{fill:none;stroke:#12202b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-bad{fill:none;stroke:#b3302b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-acc{fill:none;stroke:#0a6b84;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mk-ln{fill:#5b6a78}.mk-acc{fill:#0a6b84}.mk-bad{fill:#b3302b}.mk-good{fill:#1d7a45}
@media (prefers-color-scheme: dark){
.bg{fill:#15202a}
.t,.tb,.m{fill:#e6edf3}.s{fill:#98a8b6}.h{fill:#4fb6cf}
.box{fill:#192632;stroke:#3a4c5a}.acc{fill:#143440;stroke:#4fb6cf}.bad{fill:#3c1d1b;stroke:#ef7c76}
.good{fill:#15352a;stroke:#5cc98a}.amb{fill:#392b13;stroke:#e2a645}.dim{fill:#1b2833;stroke:#34444f}
.solid-acc{fill:#2f8fa8}.solid-bad{fill:#c9534d}.solid-good{fill:#2f9a5f}.solid-amb{fill:#b97c1e}.solid-ink{fill:#e6edf3}
.ln{stroke:#98a8b6}.ln-acc{stroke:#4fb6cf}.ln-bad{stroke:#ef7c76}.ln-good{stroke:#5cc98a}
.tx-acc{fill:#4fb6cf}.tx-bad{fill:#ef7c76}.tx-good{fill:#5cc98a}.tx-amb{fill:#e2a645}
.ic{stroke:#e6edf3}.ic-bad{stroke:#ef7c76}.ic-acc{stroke:#4fb6cf}
.mk-ln{fill:#98a8b6}.mk-acc{fill:#4fb6cf}.mk-bad{fill:#ef7c76}.mk-good{fill:#5cc98a}
}
</style><defs><marker id="a-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-ln"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-acc"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-bad"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-good"/></marker></defs><rect class="bg" width="760" height="370" rx="16"/><text x="24" y="34" class="h" text-anchor="start">DOS: ONE SOURCE</text><circle cx="70" cy="82" r="7" class="ic"/><path d="M58 106 q0 -14 12 -14 q12 0 12 14" class="ic"/><text x="70" y="128" class="s" text-anchor="middle">Attacker</text><path d="M100 90 L170 90" class="ln" marker-end="url(#a-ln)"/><rect x="190" y="75" width="30" height="20" rx="3" class="ic"/><path d="M198 101 h14 M205 95 v6" class="ic"/><text x="205" y="128" class="s" text-anchor="middle">One computer</text><path d="M240 90 L470 90" class="ln-bad" marker-end="url(#a-bad)"/><text x="355" y="78" class="s" text-anchor="middle">flood of requests</text><rect x="490" y="58" width="92" height="64" rx="10" class="bad"/><rect x="521" y="75" width="30" height="10" rx="2" class="ic-bad"/><circle cx="527" cy="80" r="1.4" class="ic-bad"/><rect x="521" y="87" width="30" height="10" rx="2" class="ic-bad"/><circle cx="527" cy="92" r="1.4" class="ic-bad"/><rect x="521" y="99" width="30" height="10" rx="2" class="ic-bad"/><circle cx="527" cy="104" r="1.4" class="ic-bad"/><text x="536" y="140" class="s" text-anchor="middle">Web server</text><rect x="612" y="66" width="128" height="48" rx="10" class="good"/><text x="676" y="87" class="s" text-anchor="middle">Easy to block:</text><text x="676" y="104" class="s" text-anchor="middle">one source</text><path d="M20 162 H740" class="ln dash"/><text x="24" y="192" class="h" text-anchor="start">DDOS: MANY SOURCES (A BOTNET)</text><circle cx="70" cy="258" r="7" class="ic"/><path d="M58 282 q0 -14 12 -14 q12 0 12 14" class="ic"/><text x="70" y="304" class="s" text-anchor="middle">Attacker</text><path d="M100 266 L160 266" class="ln" marker-end="url(#a-ln)"/><rect x="162" y="236" width="96" height="60" rx="10" class="acc"/><rect x="195" y="247" width="30" height="10" rx="2" class="ic-acc"/><circle cx="201" cy="252" r="1.4" class="ic-acc"/><rect x="195" y="259" width="30" height="10" rx="2" class="ic-acc"/><circle cx="201" cy="264" r="1.4" class="ic-acc"/><rect x="195" y="271" width="30" height="10" rx="2" class="ic-acc"/><circle cx="201" cy="276" r="1.4" class="ic-acc"/><text x="210" y="316" class="s" text-anchor="middle">C&amp;C server</text><path d="M260 266 L316 210" class="ln-acc" marker-end="url(#a-acc)"/><rect x="325" y="199" width="30" height="20" rx="3" class="ic"/><path d="M333 225 h14 M340 219 v6" class="ic"/><path d="M366 212 L486 266" class="ln-bad" marker-end="url(#a-bad)"/><path d="M260 266 L316 238" class="ln-acc" marker-end="url(#a-acc)"/><rect x="325" y="227" width="30" height="20" rx="3" class="ic"/><path d="M333 253 h14 M340 247 v6" class="ic"/><path d="M366 240 L486 266" class="ln-bad" marker-end="url(#a-bad)"/><path d="M260 266 L316 266" class="ln-acc" marker-end="url(#a-acc)"/><rect x="325" y="255" width="30" height="20" rx="3" class="ic"/><path d="M333 281 h14 M340 275 v6" class="ic"/><path d="M366 268 L486 266" class="ln-bad" marker-end="url(#a-bad)"/><path d="M260 266 L316 294" class="ln-acc" marker-end="url(#a-acc)"/><rect x="325" y="283" width="30" height="20" rx="3" class="ic"/><path d="M333 309 h14 M340 303 v6" class="ic"/><path d="M366 296 L486 266" class="ln-bad" marker-end="url(#a-bad)"/><path d="M260 266 L316 322" class="ln-acc" marker-end="url(#a-acc)"/><rect x="325" y="311" width="30" height="20" rx="3" class="ic"/><path d="M333 337 h14 M340 331 v6" class="ic"/><path d="M366 324 L486 266" class="ln-bad" marker-end="url(#a-bad)"/><text x="340" y="352" class="s" text-anchor="middle">Infected &#x27;zombie&#x27; computers</text><rect x="490" y="234" width="92" height="64" rx="10" class="bad"/><rect x="521" y="251" width="30" height="10" rx="2" class="ic-bad"/><circle cx="527" cy="256" r="1.4" class="ic-bad"/><rect x="521" y="263" width="30" height="10" rx="2" class="ic-bad"/><circle cx="527" cy="268" r="1.4" class="ic-bad"/><rect x="521" y="275" width="30" height="10" rx="2" class="ic-bad"/><circle cx="527" cy="280" r="1.4" class="ic-bad"/><text x="536" y="316" class="s" text-anchor="middle">Web server</text><rect x="612" y="232" width="128" height="70" rx="10" class="bad"/><text x="676" y="257" class="s" text-anchor="middle">Hard to block:</text><text x="676" y="274" class="s" text-anchor="middle">traffic from</text><text x="676" y="291" class="s" text-anchor="middle">everywhere</text></svg>
