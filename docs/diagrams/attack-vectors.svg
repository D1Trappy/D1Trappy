<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="t d"><title id="t">Attack vectors into a network</title><desc id="d">A college network in the centre, with four routes in. Wireless: Wi-Fi, Bluetooth, NFC and RFID. A fake access point pretending to be trusted. The internet connection through the modem or router. An internal device such as a switch, router or access point. One weak device in the middle can expose every device on the network.</desc><style>
.bg{fill:#ffffff}
.t{font:600 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.tb{font:700 17px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.s{font:500 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#5b6a78}
.m{font:600 13px ui-monospace,Menlo,Consolas,monospace;fill:#12202b}
.h{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#0a6b84;letter-spacing:.08em}
.w{fill:#ffffff}
.box{fill:#f3f8fa;stroke:#a9bfca;stroke-width:1.5}
.acc{fill:#e3f1f5;stroke:#0a6b84;stroke-width:1.5}
.bad{fill:#fbe5e3;stroke:#b3302b;stroke-width:1.5}
.good{fill:#e1f3e8;stroke:#1d7a45;stroke-width:1.5}
.amb{fill:#fbf0dc;stroke:#a8650a;stroke-width:1.5}
.dim{fill:#eef2f4;stroke:#c9d3da;stroke-width:1.5}
.solid-acc{fill:#0a6b84}.solid-bad{fill:#b3302b}.solid-good{fill:#1d7a45}.solid-amb{fill:#a8650a}.solid-ink{fill:#12202b}
.ln{stroke:#5b6a78;stroke-width:2;fill:none}
.ln-acc{stroke:#0a6b84;stroke-width:2.2;fill:none}
.ln-bad{stroke:#b3302b;stroke-width:2.2;fill:none}
.ln-good{stroke:#1d7a45;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5}
.tx-acc{fill:#0a6b84}.tx-bad{fill:#b3302b}.tx-good{fill:#1d7a45}.tx-amb{fill:#a8650a}
.ic{fill:none;stroke:#12202b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-bad{fill:none;stroke:#b3302b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-acc{fill:none;stroke:#0a6b84;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mk-ln{fill:#5b6a78}.mk-acc{fill:#0a6b84}.mk-bad{fill:#b3302b}.mk-good{fill:#1d7a45}
@media (prefers-color-scheme: dark){
.bg{fill:#15202a}
.t,.tb,.m{fill:#e6edf3}.s{fill:#98a8b6}.h{fill:#4fb6cf}
.box{fill:#192632;stroke:#3a4c5a}.acc{fill:#143440;stroke:#4fb6cf}.bad{fill:#3c1d1b;stroke:#ef7c76}
.good{fill:#15352a;stroke:#5cc98a}.amb{fill:#392b13;stroke:#e2a645}.dim{fill:#1b2833;stroke:#34444f}
.solid-acc{fill:#2f8fa8}.solid-bad{fill:#c9534d}.solid-good{fill:#2f9a5f}.solid-amb{fill:#b97c1e}.solid-ink{fill:#e6edf3}
.ln{stroke:#98a8b6}.ln-acc{stroke:#4fb6cf}.ln-bad{stroke:#ef7c76}.ln-good{stroke:#5cc98a}
.tx-acc{fill:#4fb6cf}.tx-bad{fill:#ef7c76}.tx-good{fill:#5cc98a}.tx-amb{fill:#e2a645}
.ic{stroke:#e6edf3}.ic-bad{stroke:#ef7c76}.ic-acc{stroke:#4fb6cf}
.mk-ln{fill:#98a8b6}.mk-acc{fill:#4fb6cf}.mk-bad{fill:#ef7c76}.mk-good{fill:#5cc98a}
}
</style><defs><marker id="a-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-ln"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-acc"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-bad"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-good"/></marker></defs><rect class="bg" width="760" height="280" rx="16"/><text x="24" y="32" class="h" text-anchor="start">ATTACK VECTORS: ROUTES INTO A NETWORK</text><rect x="280" y="110" width="200" height="100" rx="10" class="acc"/><text x="380" y="150" class="tb" text-anchor="middle">College network</text><text x="380" y="172" class="s" text-anchor="middle">routers · switches</text><text x="380" y="190" class="s" text-anchor="middle">access points</text><rect x="20" y="70" width="200" height="70" rx="10" class="amb"/><text x="120.0" y="102.0" class="t" text-anchor="middle">Wireless</text><text x="120.0" y="121.0" class="s" text-anchor="middle">Wi-Fi, Bluetooth, NFC, RFID</text><rect x="20" y="180" width="200" height="70" rx="10" class="bad"/><text x="120.0" y="212.0" class="t" text-anchor="middle">Fake access point</text><text x="120.0" y="231.0" class="s" text-anchor="middle">pretends to be trusted</text><rect x="540" y="70" width="200" height="70" rx="10" class="amb"/><text x="640.0" y="102.0" class="t" text-anchor="middle">Internet connection</text><text x="640.0" y="121.0" class="s" text-anchor="middle">modem / router</text><rect x="540" y="180" width="200" height="70" rx="10" class="amb"/><text x="640.0" y="212.0" class="t" text-anchor="middle">Internal device</text><text x="640.0" y="231.0" class="s" text-anchor="middle">switch, router, AP</text><path d="M222 105 L278 140" class="ln-bad" marker-end="url(#a-bad)"/><path d="M222 215 L278 180" class="ln-bad" marker-end="url(#a-bad)"/><path d="M538 105 L482 140" class="ln-bad" marker-end="url(#a-bad)"/><path d="M538 215 L482 180" class="ln-bad" marker-end="url(#a-bad)"/><text x="380" y="262" class="s" text-anchor="middle">One weak device in the middle can expose every device on the network</text></svg>
