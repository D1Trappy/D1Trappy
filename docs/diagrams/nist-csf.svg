<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 184" width="780" height="184" role="img" aria-labelledby="t d"><title id="t">NIST Cybersecurity Framework: five core functions</title><desc id="d">The five core functions of the NIST Cybersecurity Framework in order. Identify: know what to protect and the risks. Protect: put safeguards in place. Detect: spot attacks quickly. Respond: act to contain an incident. Recover: restore systems and learn from it, then the cycle repeats.</desc><style>
.bg{fill:#ffffff}
.t{font:600 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.tb{font:700 17px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.s{font:500 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#5b6a78}
.m{font:600 13px ui-monospace,Menlo,Consolas,monospace;fill:#12202b}
.h{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#0a6b84;letter-spacing:.08em}
.w{fill:#ffffff}
.box{fill:#f3f8fa;stroke:#a9bfca;stroke-width:1.5}
.acc{fill:#e3f1f5;stroke:#0a6b84;stroke-width:1.5}
.bad{fill:#fbe5e3;stroke:#b3302b;stroke-width:1.5}
.good{fill:#e1f3e8;stroke:#1d7a45;stroke-width:1.5}
.amb{fill:#fbf0dc;stroke:#a8650a;stroke-width:1.5}
.dim{fill:#eef2f4;stroke:#c9d3da;stroke-width:1.5}
.solid-acc{fill:#0a6b84}.solid-bad{fill:#b3302b}.solid-good{fill:#1d7a45}.solid-amb{fill:#a8650a}.solid-ink{fill:#12202b}
.ln{stroke:#5b6a78;stroke-width:2;fill:none}
.ln-acc{stroke:#0a6b84;stroke-width:2.2;fill:none}
.ln-bad{stroke:#b3302b;stroke-width:2.2;fill:none}
.ln-good{stroke:#1d7a45;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5}
.tx-acc{fill:#0a6b84}.tx-bad{fill:#b3302b}.tx-good{fill:#1d7a45}.tx-amb{fill:#a8650a}
.ic{fill:none;stroke:#12202b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-bad{fill:none;stroke:#b3302b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-acc{fill:none;stroke:#0a6b84;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mk-ln{fill:#5b6a78}.mk-acc{fill:#0a6b84}.mk-bad{fill:#b3302b}.mk-good{fill:#1d7a45}
@media (prefers-color-scheme: dark){
.bg{fill:#15202a}
.t,.tb,.m{fill:#e6edf3}.s{fill:#98a8b6}.h{fill:#4fb6cf}
.box{fill:#192632;stroke:#3a4c5a}.acc{fill:#143440;stroke:#4fb6cf}.bad{fill:#3c1d1b;stroke:#ef7c76}
.good{fill:#15352a;stroke:#5cc98a}.amb{fill:#392b13;stroke:#e2a645}.dim{fill:#1b2833;stroke:#34444f}
.solid-acc{fill:#2f8fa8}.solid-bad{fill:#c9534d}.solid-good{fill:#2f9a5f}.solid-amb{fill:#b97c1e}.solid-ink{fill:#e6edf3}
.ln{stroke:#98a8b6}.ln-acc{stroke:#4fb6cf}.ln-bad{stroke:#ef7c76}.ln-good{stroke:#5cc98a}
.tx-acc{fill:#4fb6cf}.tx-bad{fill:#ef7c76}.tx-good{fill:#5cc98a}.tx-amb{fill:#e2a645}
.ic{stroke:#e6edf3}.ic-bad{stroke:#ef7c76}.ic-acc{stroke:#4fb6cf}
.mk-ln{fill:#98a8b6}.mk-acc{fill:#4fb6cf}.mk-bad{fill:#ef7c76}.mk-good{fill:#5cc98a}
}
</style><defs><marker id="a-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-ln"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-acc"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-bad"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-good"/></marker></defs><rect class="bg" width="780" height="184" rx="16"/><text x="20" y="26" class="h" text-anchor="start">NIST CYBERSECURITY FRAMEWORK: FIVE CORE FUNCTIONS</text><polygon points="20.0,40 144.0,40 160.0,85 144.0,130 20.0,130" class="acc" stroke-linejoin="round"/><text x="82.0" y="70" class="tb" text-anchor="middle">Identify</text><text x="82.0" y="94" class="s" text-anchor="middle">What to protect</text><text x="82.0" y="112" class="s" text-anchor="middle">and the risks</text><polygon points="170.0,40 294.0,40 310.0,85 294.0,130 170.0,130 186.0,85" class="good" stroke-linejoin="round"/><text x="240.0" y="70" class="tb" text-anchor="middle">Protect</text><text x="240.0" y="94" class="s" text-anchor="middle">Safeguards, e.g.</text><text x="240.0" y="112" class="s" text-anchor="middle">access, training</text><polygon points="320.0,40 444.0,40 460.0,85 444.0,130 320.0,130 336.0,85" class="amb" stroke-linejoin="round"/><text x="390.0" y="70" class="tb" text-anchor="middle">Detect</text><text x="390.0" y="94" class="s" text-anchor="middle">Spot attacks</text><text x="390.0" y="112" class="s" text-anchor="middle">quickly</text><polygon points="470.0,40 594.0,40 610.0,85 594.0,130 470.0,130 486.0,85" class="bad" stroke-linejoin="round"/><text x="540.0" y="70" class="tb" text-anchor="middle">Respond</text><text x="540.0" y="94" class="s" text-anchor="middle">Contain it,</text><text x="540.0" y="112" class="s" text-anchor="middle">limit damage</text><polygon points="620.0,40 744.0,40 760.0,85 744.0,130 620.0,130 636.0,85" class="acc" stroke-linejoin="round"/><text x="690.0" y="70" class="tb" text-anchor="middle">Recover</text><text x="690.0" y="94" class="s" text-anchor="middle">Restore, then</text><text x="690.0" y="112" class="s" text-anchor="middle">learn from it</text><path d="M740 136 q0 20 -20 20 H60 q-20 0 -20 -20" class="ln dash"/><path d="M34 142 l6 -8 l6 8" class="ln"/><text x="390.0" y="151" class="s" text-anchor="middle">Learn from each incident and start again</text></svg>
