<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="t d"><title id="t">How a firewall uses ports</title><desc id="d">Traffic from the internet reaches the firewall, which acts as a gate. Ports that are needed, such as 443 for HTTPS and 80 for HTTP, are allowed through to the trusted network. Ports that are not needed, such as 3389 Remote Desktop and 21 FTP, are blocked. Close or block ports that aren&#x27;t needed.</desc><style>
.bg{fill:#ffffff}
.t{font:600 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.tb{font:700 17px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.s{font:500 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#5b6a78}
.m{font:600 13px ui-monospace,Menlo,Consolas,monospace;fill:#12202b}
.h{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#0a6b84;letter-spacing:.08em}
.w{fill:#ffffff}
.box{fill:#f3f8fa;stroke:#a9bfca;stroke-width:1.5}
.acc{fill:#e3f1f5;stroke:#0a6b84;stroke-width:1.5}
.bad{fill:#fbe5e3;stroke:#b3302b;stroke-width:1.5}
.good{fill:#e1f3e8;stroke:#1d7a45;stroke-width:1.5}
.amb{fill:#fbf0dc;stroke:#a8650a;stroke-width:1.5}
.dim{fill:#eef2f4;stroke:#c9d3da;stroke-width:1.5}
.solid-acc{fill:#0a6b84}.solid-bad{fill:#b3302b}.solid-good{fill:#1d7a45}.solid-amb{fill:#a8650a}.solid-ink{fill:#12202b}
.ln{stroke:#5b6a78;stroke-width:2;fill:none}
.ln-acc{stroke:#0a6b84;stroke-width:2.2;fill:none}
.ln-bad{stroke:#b3302b;stroke-width:2.2;fill:none}
.ln-good{stroke:#1d7a45;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5}
.tx-acc{fill:#0a6b84}.tx-bad{fill:#b3302b}.tx-good{fill:#1d7a45}.tx-amb{fill:#a8650a}
.ic{fill:none;stroke:#12202b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-bad{fill:none;stroke:#b3302b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-acc{fill:none;stroke:#0a6b84;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mk-ln{fill:#5b6a78}.mk-acc{fill:#0a6b84}.mk-bad{fill:#b3302b}.mk-good{fill:#1d7a45}
@media (prefers-color-scheme: dark){
.bg{fill:#15202a}
.t,.tb,.m{fill:#e6edf3}.s{fill:#98a8b6}.h{fill:#4fb6cf}
.box{fill:#192632;stroke:#3a4c5a}.acc{fill:#143440;stroke:#4fb6cf}.bad{fill:#3c1d1b;stroke:#ef7c76}
.good{fill:#15352a;stroke:#5cc98a}.amb{fill:#392b13;stroke:#e2a645}.dim{fill:#1b2833;stroke:#34444f}
.solid-acc{fill:#2f8fa8}.solid-bad{fill:#c9534d}.solid-good{fill:#2f9a5f}.solid-amb{fill:#b97c1e}.solid-ink{fill:#e6edf3}
.ln{stroke:#98a8b6}.ln-acc{stroke:#4fb6cf}.ln-bad{stroke:#ef7c76}.ln-good{stroke:#5cc98a}
.tx-acc{fill:#4fb6cf}.tx-bad{fill:#ef7c76}.tx-good{fill:#5cc98a}.tx-amb{fill:#e2a645}
.ic{stroke:#e6edf3}.ic-bad{stroke:#ef7c76}.ic-acc{stroke:#4fb6cf}
.mk-ln{fill:#98a8b6}.mk-acc{fill:#4fb6cf}.mk-bad{fill:#ef7c76}.mk-good{fill:#5cc98a}
}
</style><defs><marker id="a-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-ln"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-acc"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-bad"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-good"/></marker></defs><rect class="bg" width="760" height="270" rx="16"/><text x="24" y="32" class="h" text-anchor="start">A FIREWALL IS A GATE BETWEEN THE INTERNET AND YOUR NETWORK</text><path transform="translate(90 140) scale(1.4)" d="M-26 12 h52 a13 13 0 0 0 0 -26 a19 19 0 0 0 -36 -6 a13 13 0 0 0 -16 32 z" class="ic"/><text x="90" y="196" class="t" text-anchor="middle">Internet</text><rect x="250" y="52" width="190" height="196" rx="10" class="acc"/><text x="345" y="76" class="tb" text-anchor="middle">Firewall</text><rect x="266" y="96" width="158" height="28" rx="8" class="good"/><text x="345" y="115" class="s" text-anchor="middle">443 HTTPS</text><path d="M150 142 L262 110" class="ln-good" marker-end="url(#a-good)"/><path d="M428 110 L560 150" class="ln-good" marker-end="url(#a-good)"/><rect x="266" y="132" width="158" height="28" rx="8" class="good"/><text x="345" y="151" class="s" text-anchor="middle">80 HTTP</text><path d="M150 142 L262 146" class="ln-good" marker-end="url(#a-good)"/><path d="M428 146 L560 150" class="ln-good" marker-end="url(#a-good)"/><rect x="266" y="168" width="158" height="28" rx="8" class="bad"/><text x="345" y="187" class="s" text-anchor="middle">3389 Remote Desktop</text><path d="M150 146 L262 182" class="ln-bad dash" marker-end="url(#a-bad)"/><circle cx="444" cy="182" r="11" class="bad"/><path d="M439.5 177.5 l9 9 M448.5 177.5 l-9 9" class="ln-bad"/><rect x="266" y="204" width="158" height="28" rx="8" class="bad"/><text x="345" y="223" class="s" text-anchor="middle">21 FTP (not needed)</text><path d="M150 146 L262 218" class="ln-bad dash" marker-end="url(#a-bad)"/><circle cx="444" cy="218" r="11" class="bad"/><path d="M439.5 213.5 l9 9 M448.5 213.5 l-9 9" class="ln-bad"/><rect x="564" y="96" width="176" height="110" rx="10" class="good"/><rect x="597" y="123" width="30" height="20" rx="3" class="ic"/><path d="M605 149 h14 M612 143 v6" class="ic"/><rect x="675" y="123" width="30" height="10" rx="2" class="ic"/><circle cx="681" cy="128" r="1.4" class="ic"/><rect x="675" y="135" width="30" height="10" rx="2" class="ic"/><circle cx="681" cy="140" r="1.4" class="ic"/><rect x="675" y="147" width="30" height="10" rx="2" class="ic"/><circle cx="681" cy="152" r="1.4" class="ic"/><text x="652" y="186" class="t" text-anchor="middle">Trusted network</text><text x="560" y="236" class="s" text-anchor="middle">Close or block ports</text><text x="560" y="254" class="s" text-anchor="middle">that aren&#x27;t needed</text></svg>
